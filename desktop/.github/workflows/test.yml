name: Test Build

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  rust:
    name: Rust Tests
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: acerola

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('acerola/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo test tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-make.exe
            ~/.cargo/bin/cargo-nextest.exe
          key: ${{ runner.os }}-cargo-test-tools-v1

      - name: Install Cargo test tools
        run: |
          $cargoBin = "$HOME/.cargo/bin"
          New-Item -ItemType Directory -Force $cargoBin | Out-Null

          if (!(Test-Path "$cargoBin/cargo-make.exe")) {
            cargo install cargo-make --locked
          }

          if (!(Test-Path "$cargoBin/cargo-nextest.exe")) {
            cargo install cargo-nextest --locked
          }

          Add-Content -Path $env:GITHUB_PATH -Value $cargoBin

      - name: Cache Rust test target
        uses: actions/cache@v4
        with:
          path: acerola/src-tauri/target
          key: ${{ runner.os }}-cargo-target-rust-${{ hashFiles('acerola/src-tauri/Cargo.lock', 'acerola/src-tauri/Cargo.toml', 'acerola/src-tauri/Makefile.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-rust-

      - name: Run Rust checks and tests
        run: cargo make --cwd ./src-tauri ci

  svelte:
    name: Svelte Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acerola

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          cache: npm
          cache-dependency-path: acerola/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('acerola/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Svelte check
        run: npm run check

      - name: Run Svelte tests
        run: npm run test

  wdio:
    name: WebdriverIO Tests
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: acerola

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          cache: npm
          cache-dependency-path: acerola/package-lock.json

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('acerola/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Tauri WebDriver tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/tauri-driver.exe
            ~/.cargo/bin/msedgedriver-tool.exe
          key: ${{ runner.os }}-tauri-webdriver-tools-v1

      - name: Install Tauri WebDriver tools
        run: |
          $cargoBin = "$HOME/.cargo/bin"
          New-Item -ItemType Directory -Force $cargoBin | Out-Null

          if (!(Test-Path "$cargoBin/tauri-driver.exe")) {
            cargo install tauri-driver --locked
          }

          if (!(Test-Path "$cargoBin/msedgedriver-tool.exe")) {
            cargo install --git https://github.com/chippers/msedgedriver-tool
          }

          Add-Content -Path $env:GITHUB_PATH -Value $cargoBin

      - name: Get Microsoft Edge version
        id: edge-version
        run: |
          $edgePaths = @(
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
          )

          $edgePath = $edgePaths | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (!$edgePath) {
            throw "Microsoft Edge was not found."
          }

          $edgeVersion = (Get-Item $edgePath).VersionInfo.ProductVersion
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$edgeVersion"

      - name: Cache Microsoft Edge WebDriver
        uses: actions/cache@v4
        with:
          path: acerola/.bin/windows/msedgedriver.exe
          key: ${{ runner.os }}-msedgedriver-${{ steps.edge-version.outputs.version }}

      - name: Install Microsoft Edge WebDriver
        run: |
          $nativeDriverDir = ".\.bin\windows"
          $nativeDriverPath = "$nativeDriverDir\msedgedriver.exe"

          New-Item -ItemType Directory -Force $nativeDriverDir | Out-Null

          if (!(Test-Path $nativeDriverPath)) {
            & "$HOME/.cargo/bin/msedgedriver-tool.exe"

            if (Test-Path ".\msedgedriver.exe") {
              Move-Item -Force ".\msedgedriver.exe" $nativeDriverPath
            }
          }

          if (!(Test-Path $nativeDriverPath)) {
            throw "msedgedriver.exe was not generated at .bin/windows/msedgedriver.exe"
          }

          Add-Content -Path $env:GITHUB_PATH -Value (Resolve-Path $nativeDriverDir)

      - name: Cache Tauri release target
        uses: actions/cache@v4
        with:
          path: acerola/src-tauri/target
          key: ${{ runner.os }}-cargo-target-wdio-${{ hashFiles('acerola/src-tauri/Cargo.lock', 'acerola/src-tauri/Cargo.toml', 'acerola/src-tauri/tauri.conf.json', 'acerola/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-wdio-

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri -- build --no-bundle

      - name: Smoke-test app binary
        run: |
          $appPath = "src-tauri\target\release\acerola.exe"
          $tmpData = Join-Path ([System.IO.Path]::GetTempPath()) "acerola-smoke-$([System.Guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Force $tmpData | Out-Null

          $proc = Start-Process -FilePath $appPath -PassThru -NoNewWindow `
            -RedirectStandardOutput "$tmpData\stdout.txt" `
            -RedirectStandardError  "$tmpData\stderr.txt"

          Start-Sleep -Seconds 15

          if ($proc.HasExited) {
            Write-Host "[smoke-test] App exited unexpectedly (code $($proc.ExitCode))"
            if (Test-Path "$tmpData\stdout.txt") { Get-Content "$tmpData\stdout.txt" }
            if (Test-Path "$tmpData\stderr.txt") { Get-Content "$tmpData\stderr.txt" }
            throw "App binary crashed on startup."
          }

          Write-Host "[smoke-test] App is alive after 15s — OK"
          $proc.Kill()
          Remove-Item -Recurse -Force $tmpData

      - name: Run WebdriverIO tests
        run: npm run test:wdio

      - name: Print PANIC_LOG.txt if exists
        if: always()
        run: |
          if (Test-Path "acerola/src-tauri/PANIC_LOG.txt") {
            Get-Content "acerola/src-tauri/PANIC_LOG.txt"
          }
          if (Test-Path "acerola/PANIC_LOG.txt") {
            Get-Content "acerola/PANIC_LOG.txt"
          }
