name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build & Release (Windows)
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: acerola

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          cache: npm
          cache-dependency-path: acerola/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            acerola/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Extract versions from tag
        shell: bash
        run: |
          VERSION_FULL=${GITHUB_REF_NAME#v}
          VERSION_MSI=${VERSION_FULL%%-*}
          echo "VERSION_FULL=$VERSION_FULL" >> $GITHUB_ENV
          echo "VERSION_MSI=$VERSION_MSI" >> $GITHUB_ENV

      - name: Update tauri.conf.json (versão MSI sem sufixo)
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            config.version = process.env.VERSION_MSI;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(config, null, 2) + '\n');
          "
        env:
          VERSION_MSI: ${{ env.VERSION_MSI }}

      - name: Update Cargo.toml
        shell: bash
        run: |
          sed -i "s/^version = \".*\"/version = \"$VERSION_FULL\"/" src-tauri/Cargo.toml
        env:
          VERSION_FULL: ${{ env.VERSION_FULL }}

      - name: Update package.json
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.VERSION_FULL;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
        env:
          VERSION_FULL: ${{ env.VERSION_FULL }}

      - name: Build MSI
        run: npm run tauri -- build --bundles msi

      - name: Rename MSI
        shell: powershell
        run: |
          $msi = Get-Item "src-tauri/target/release/bundle/msi/*.msi"
          Rename-Item $msi.FullName "acerola-windows-x86_64.msi"

      - name: Check AWS CLI
        run: aws --version

      - name: Upload to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          # Faz o upload da versão específica (fazemos cache longo por ser imutável)
          aws s3 cp src-tauri/target/release/bundle/msi/acerola-windows-x86_64.msi s3://${{ secrets.R2_BUCKET_NAME }}/releases/v${{ env.VERSION_FULL }}/acerola-windows-x86_64.msi --endpoint-url "$R2_ENDPOINT" --cache-control "public,max-age=31536000"
          
          # Faz o upload e sobrescreve a versão 'latest' (invalida cache para baixar sempre a versão nova)
          aws s3 cp src-tauri/target/release/bundle/msi/acerola-windows-x86_64.msi s3://${{ secrets.R2_BUCKET_NAME }}/releases/latest/acerola-windows-x86_64.msi --endpoint-url "$R2_ENDPOINT" --cache-control "no-cache"

      - name: Verify upload
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 ls s3://${{ secrets.R2_BUCKET_NAME }}/releases/latest/acerola-windows-x86_64.msi --endpoint-url "$R2_ENDPOINT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Acerola ${{ env.VERSION_FULL }}
          draft: false
          prerelease: ${{ contains(env.VERSION_FULL, '-') }}
          files: acerola/src-tauri/target/release/bundle/msi/acerola-windows-x86_64.msi
          generate_release_notes: true
