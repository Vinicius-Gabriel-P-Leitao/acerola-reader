[config]
default_to_workspace = false
skip_core_tasks = true

[tasks.default]
alias = "test"

[tasks.test]
args = ["nextest", "run"]
command = "cargo"
description = "Run all tests using nextest"
workspace = false

[tasks.test.windows]
env = { RUSTFLAGS = "-C link-arg=/MANIFEST:EMBED -C link-arg=/MANIFESTINPUT:${CARGO_MAKE_WORKING_DIRECTORY}/tests/windows-app-manifest.xml" }

[tasks.test-verbose]
args = ["nextest", "run", "--no-capture"]
command = "cargo"
description = "Run all tests using nextest with verbose output"
workspace = false

[tasks.test-verbose.windows]
env = { RUSTFLAGS = "-C link-arg=/MANIFEST:EMBED -C link-arg=/MANIFESTINPUT:${CARGO_MAKE_WORKING_DIRECTORY}/tests/windows-app-manifest.xml" }

[tasks.test-ci]
args = ["nextest", "run", "--profile", "ci"]
command = "cargo"
description = "Run tests in CI profile (longer timeouts, no fail-fast)"
workspace = false

[tasks.test-ci.windows]
env = { RUSTFLAGS = "-C link-arg=/MANIFEST:EMBED -C link-arg=/MANIFESTINPUT:${CARGO_MAKE_WORKING_DIRECTORY}/tests/windows-app-manifest.xml" }

[tasks.format]
args = [
  "fmt",
  "--all",
  "--",
  "--config",
  "unstable_features=true",
  "--config",
  "imports_granularity=Crate,group_imports=StdExternalCrate,reorder_imports=true,format_code_in_doc_comments=true",
]
command = "cargo"
description = "Formats the code with import grouping and doc comment formatting"
workspace = false

[tasks.lint]
args = ["clippy", "--all-targets", "--all-features", "--", "-D", "warnings"]
command = "cargo"
description = "Run clippy lints"
workspace = false

[tasks.check]
args = ["check", "--all-targets", "--all-features"]
command = "cargo"
description = "Check Rust code"
workspace = false

[tasks.ci]
dependencies = ["check", "lint", "test-ci"]
description = "Run full CI pipeline: check, lint, test"
workspace = false
