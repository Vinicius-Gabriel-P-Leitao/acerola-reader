# Android NDK targets — requer NDK instalado e ANDROID_NDK_HOME configurado.
# Adicione os toolchains com: rustup target add <target>

[target.aarch64-linux-android]
linker = "aarch64-linux-android-clang"
ar = "llvm-ar"

[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi-clang"
ar = "llvm-ar"

[target.x86_64-linux-android]
linker = "x86_64-linux-android-clang"
ar = "llvm-ar"

[target.i686-linux-android]
linker = "i686-linux-android-clang"
ar = "llvm-ar"

# Linux targets (cross-compilation via CI)
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# Otimizações globais de build
[build]
jobs = 4

[profile.release]
lto = "thin"
codegen-units = 1
