[package]
authors = ["Vinícius Gabriel Pereira Leitão"]
description = "FFI para implementar camada p2p para o android conectar a outros node"
edition = "2021"
license = "MPL-2.0"
name = "acerola_android"
version = "0.0.1"

[lib]
crate-type = ["cdylib"]
name = "acerola"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
acerola-p2p = { path = "../../../../lib/p2p", features = ["iroh", "iroh-blobs-adapter"] }
async-trait = "0.1.89"
futures = "0.3"
once_cell = "1.20.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0.149"
thiserror = "2"
tokio = {version = "1.51.0", features = ["full"]}
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
uniffi = {version = "0.28.0", features = ["cli", "tokio"]}

[target.'cfg(target_os = "android")'.dependencies]
jni = {version = "0.21", default-features = false}
ndk-context = "0.1"
tracing-android = "0.2.0"

[build-dependencies]
uniffi = {version = "0.28.0", features = ["build"]}

[dev-dependencies]
blake3 = "1.5"
